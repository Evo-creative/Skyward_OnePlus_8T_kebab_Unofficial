[device]
codename = "kebab"
brand = "OnePlus"
model = "OnePlus 8T"
ab = true
soc = { hans = "骁龙865", hant = "驍龍865", en = "Snapdragon 865" }

[display]
width = 1080
height = 2400
density = 450
diagonal = 6.55
corner_radius = 24

# Every driver the recovery needs is built into the kernel this phone's
# system installs, apart from gspca_main, so none is loaded here. The
# phone has no vendor_boot and no vendor_dlkm partition; what modules it
# keeps are under vendor.
[modules]
sources = ["vendor"]
load = []

# The persist partition, which the phone mounts at /mnt/vendor/persist and
# its own recovery leaves unmounted. The WLAN chip keeps its firmware, its
# settings and its address there, and the secure world keeps files its key
# service reads.
[partitions]
mounted = ["persist"]

# The motor is an AW8697, which the kernel shows as a light: a duration,
# a strength and the word that starts it, one clip at a time. The phone's
# own system plays a click as 10 ms of the shortest clip, as its framework's
# virtual key pattern says, and sets no strength; the slider here drives the
# motor's gain from about 0x2F to the 0x75 the driver takes at most.
[haptics]
led = "/sys/class/leds/vibrator"
strength = { lightest = 0.4, strongest = 1.0 }

# The phone goes into the crash dump, and from there its bootloader's
# emergency download mode, once its screen goes dark: neither the kernel's
# s2idle suspend nor the panel coming back from rest is reliable here yet.
# So the pages keep the screen lit and the phone awake, and the settings
# page's screen-off choice has no effect.
[power]
blank = false
suspend = false
rest = false

# The modem partition holds the firmware the phone's drivers ask for, at
# /vendor/firmware_mnt on the phone.
[firmware]
partition = "modem"

# WLAN: the WCN6855/QCA6390 on PCIe, driven by the built-in qca_cld3_wlan
# over the cnss2 platform driver. Once fs_ready is written, cnss2 powers
# the chip up and wlan0 appears. The chip's settings and MAC address are
# on the persist partition, which the driver reads there itself, and on the
# odm partition's wifi folder.
#
# The phone's own programs come first: the QMI name service the firmware's
# service is found through, and the daemon that carries the calibration and
# the MAC address between the firmware and the modem. Neither runs by
# itself in a recovery, and without them the firmware never reports ready.
# The QMI name service the firmware's service is found through, and the
# daemon that carries the calibration and the MAC address between the
# firmware and the modem. Neither runs by itself in a recovery, and without
# them the firmware never reports ready. The daemon answers on a folder of
# its own on the data partition, which is made when the WLAN comes up.
# The directory the phone's vendor side registers with, which the WLAN
# service this phone runs is one of: without it that service waits for a
# directory that never comes.
[[service]]
path = "/vendor/bin/vndservicemanager"
args = ["/dev/vndbinder"]
user = "system"
groups = ["system", "readproc"]

[[service]]
path = "/vendor/bin/qrtr-ns"

[[service]]
path = "/vendor/bin/cnss-daemon"
args = ["-n"]
user = "system"
groups = ["system", "inet", "net_admin", "wifi"]
capabilities = ["NET_ADMIN"]

[wlan]
modules = []
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
# The supplicant is a vendor program that loads the installed system's
# platform libraries, which a recovery's own folders do not hold: the
# linker's bootstrap folder is searched last for the few that live only
# there.
libraries = [
  "/vendor/lib64",
  "/mnt/system/system/lib64",
  "/mnt/system/system_ext/lib64",
  "/system/lib64",
  "/mnt/system/system/lib64/bootstrap",
]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connectivitycheck.gstatic.com/generate_204"

# The partitions a backup of the baseband takes, and what of the data
# partition a backup leaves out because the secure world keeps it in step
# with itself.
[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]
data_skipped = ["vendor/tzstorage", "vendor/qtee", "vendor/fingerprint", "vendor/optical_fingerprint"]

# Where the phone's own programs keep logs in the data partition.
[wipe]
logs = [
    "/data/vendor/ramdump",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
]